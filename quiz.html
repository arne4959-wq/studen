<!doctype html>
<html lang="lo" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.quiz"></title>
  <script>try{var d=document.documentElement,s=localStorage;if(s.getItem("hianngai:theme")==="light")d.dataset.theme="light";d.lang=s.getItem("hianngai:lang")||"lo"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/pages/quiz.js"></script>
</head>
<body>
  <main id="main" class="focus-page quiz" tabindex="-1">
    <header class="quiz__head">
      <button class="btn btn--ghost" type="button" id="quiz-exit"><span class="btn__prompt" aria-hidden="true">←</span><span class="btn__label" data-i18n="quiz.exit"></span></button>
      <p class="quiz__progress" id="quiz-progress"></p>
    </header>
    <section class="quiz__body" id="quiz"></section>
  </main>
</body>
</html>
