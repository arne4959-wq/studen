<!doctype html>
<html lang="lo" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.language"></title>
  <script>try{var d=document.documentElement,s=localStorage;if(s.getItem("hianngai:theme")==="light")d.dataset.theme="light";d.lang=s.getItem("hianngai:lang")||"lo"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/pages/language.js"></script>
</head>
<body>
  <main id="main" class="page page--narrow" tabindex="-1">
    <p class="crumb"><a class="btn btn--ghost" href="profile.html"><span aria-hidden="true">← </span><span data-i18n="common.backProfile"></span></a></p>
    <form class="lang-form" id="lang-form">
      <fieldset>
        <legend class="page-head">
          <span class="eyebrow" data-i18n="language.eyebrow"></span>
          <h1 data-i18n="language.title"></h1>
        </legend>
        <p class="field__hint" data-i18n="language.hint"></p>
        <div class="options">
          <label class="option"><input type="radio" name="lang" value="lo"><span class="option__name" lang="lo" data-i18n="lang.lo"></span><span class="option__code" translate="no" aria-hidden="true">lo</span></label>
          <label class="option"><input type="radio" name="lang" value="th"><span class="option__name" lang="th" data-i18n="lang.th"></span><span class="option__code" translate="no" aria-hidden="true">th</span></label>
          <label class="option"><input type="radio" name="lang" value="en"><span class="option__name" lang="en" data-i18n="lang.en"></span><span class="option__code" translate="no" aria-hidden="true">en</span></label>
        </div>
      </fieldset>
      <div id="lang-msg" aria-live="polite"></div>
    </form>
  </main>
</body>
</html>
