<!doctype html>
<html lang="lo" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.password"></title>
  <script>try{var d=document.documentElement,s=localStorage;if(s.getItem("hianngai:theme")==="light")d.dataset.theme="light";d.lang=s.getItem("hianngai:lang")||"lo"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/pages/change-password.js"></script>
</head>
<body>
  <main id="main" class="page page--narrow" tabindex="-1">
    <p class="crumb"><a class="btn btn--ghost" href="profile.html"><span aria-hidden="true">← </span><span data-i18n="common.backProfile"></span></a></p>
    <div class="page-head">
      <p class="eyebrow" data-i18n="password.eyebrow"></p>
      <h1 data-i18n="password.title"></h1>
    </div>
    <form class="auth__form" id="password-form" novalidate>
      <div id="form-msg" aria-live="polite"></div>
      <div class="field">
        <label class="field__label" for="current" data-i18n="password.current"></label>
        <input class="input" id="current" name="current" type="password" autocomplete="current-password" required aria-describedby="current-error">
        <p class="field__error" id="current-error" hidden></p>
      </div>
      <div class="field">
        <label class="field__label" for="next" data-i18n="password.next"></label>
        <input class="input" id="next" name="next" type="password" autocomplete="new-password" minlength="8" required aria-describedby="next-hint next-error">
        <p class="field__hint" id="next-hint" data-i18n="auth.passwordHint"></p>
        <p class="field__error" id="next-error" hidden></p>
      </div>
      <div class="field">
        <label class="field__label" for="confirm" data-i18n="password.confirm"></label>
        <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required aria-describedby="confirm-error">
        <p class="field__error" id="confirm-error" hidden></p>
      </div>
      <button class="btn btn--primary btn--block" type="submit"><span class="btn__prompt" aria-hidden="true">$</span><span class="btn__label" data-i18n="password.submit"></span></button>
    </form>
  </main>
</body>
</html>
