<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>ພາສາ</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none;color:inherit} button{font-family:inherit}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0D1117;font-family:'Noto Sans Lao','Noto Sans Thai',system-ui,sans-serif;color:#E6EDF3;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:52px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #30363D;background:#161B22">
    <a href="Profile.dc.html" aria-label="ກັບຄືນ" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E6EDF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;color:#79C0FF">../language</div>
  <span style="flex-grow:1"></span><a href="LightLanguage.dc.html" aria-label="ສະຫຼັບເປັນໂໝດສະຫວ່າງ" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="position:relative;display:block;width:52px;height:30px;border-radius:15px;background:#21262D;border:1px solid #30363D;box-sizing:border-box"><span style="position:absolute;top:2px;left:2px;background:#E6EDF3;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span></a></div>

  <div style="flex-grow:1;overflow:hidden;padding:24px 20px 0;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:13px;color:#8B949E">// ມີຜົນທັນທີ ບໍ່ຕ້ອງບັນທຶກ</div>
      <h1 style="margin:0;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:28px;font-weight:700"><span style="color:#3FB950">$</span> lang</h1>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
        <sc-if value="{{l.isSel}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ l.pick }}" aria-pressed="true" style="width:100%;min-height:60px;box-sizing:border-box;border-radius:10px;background:#0F2A1A;border:2px solid #3FB950;padding:0 16px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;color:#3FB950;text-align:left;cursor:pointer"><span style="font-family:'JetBrains Mono','Noto Sans Lao',monospace">[x]</span><span style="flex-grow:1">{{l.name}}</span><span style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:12px;color:#8B949E;font-weight:400">{{l.code}}</span></button>
        </sc-if>
        <sc-if value="{{l.notSel}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ l.pick }}" aria-pressed="false" style="width:100%;min-height:60px;box-sizing:border-box;border-radius:10px;background:#161B22;border:1px solid #30363D;padding:0 16px;display:flex;align-items:center;gap:12px;font-size:17px;color:#E6EDF3;text-align:left;cursor:pointer"><span style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;color:#8B949E">[ ]</span><span style="flex-grow:1">{{l.name}}</span><span style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:12px;color:#8B949E">{{l.code}}</span></button>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink:0;padding:12px 20px 22px;background:#161B22;border-top:1px solid #30363D">
    <a href="Profile.dc.html" style="height:52px;border-radius:8px;background:#3FB950;color:#0D1117;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center">cd ../profile</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { sel: 0 };
  renderVals() {
    const L = [['ລາວ', 'lo'], ['ไทย', 'th'], ['English', 'en']];
    return {
      langs: L.map(([name, code], k) => ({
        name, code,
        isSel: this.state.sel === k,
        notSel: this.state.sel !== k,
        pick: () => this.setState({ sel: k })
      }))
    };
  }
}
</script>
</body>
</html>
