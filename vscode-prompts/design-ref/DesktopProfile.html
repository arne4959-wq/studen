<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>ໂປຣໄຟລ໌ ຈໍຄອມ</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none;color:inherit} button{font-family:inherit}</style>
</helmet>
<div style="position:relative;min-height:880px;box-sizing:border-box;background:#0D1117;font-family:'Noto Sans Lao',system-ui,sans-serif;color:#E6EDF3;display:flex;flex-wrap:wrap;align-items:stretch">

  <div style="flex:1 1 240px;max-width:260px;min-width:200px;background:#161B22;border-right:1px solid #30363D;padding:20px 12px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;font-family:'JetBrains Mono','Noto Sans Lao',monospace">
    <div style="font-size:16px;font-weight:700;padding:0 8px"><span style="color:#3FB950">~/</span>ຮຽນງ່າຍ<span style="color:#3FB950">_</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;font-size:14px">
      <div style="font-size:11px;color:#8B949E;padding:0 8px 4px;letter-spacing:.08em">EXPLORER</div>
      <a href="DesktopHome.dc.html" style="min-height:44px;box-sizing:border-box;border-radius:6px;color:#8B949E;display:flex;align-items:center;padding:0 10px">subjects/</a>
      <a href="DesktopDash.dc.html" style="min-height:44px;box-sizing:border-box;border-radius:6px;color:#8B949E;display:flex;align-items:center;padding:0 10px">stats/</a>
      <a href="DesktopProfile.dc.html" style="min-height:44px;box-sizing:border-box;border-radius:6px;background:#0F2A1A;color:#3FB950;font-weight:700;display:flex;align-items:center;padding:0 10px">&gt; profile/</a>
    </div>
  </div>

  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <div style="height:44px;background:#161B22;border-bottom:1px solid #30363D;display:flex;align-items:flex-end;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:13px">
      <div style="height:44px;display:flex;align-items:center;padding:0 20px;background:#0D1117;border-top:2px solid #3FB950;border-right:1px solid #30363D">profile.json</div>
    </div>

    <div style="box-sizing:border-box;padding:36px 48px;display:flex;flex-direction:column;gap:26px;max-width:820px">
      <h1 style="margin:0;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:30px;font-weight:700"><span style="color:#3FB950">$</span> whoami</h1>

      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:20px">
        <div style="width:72px;height:72px;border-radius:14px;background:#0F2A1A;border:2px solid #3FB950;color:#3FB950;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">U</div>
        <div style="display:flex;flex-direction:column;gap:2px"><div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:20px;font-weight:700">username</div><div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;color:#8B949E">user@example.com</div></div>
        <div style="display:flex;gap:12px;margin-left:auto;font-family:'JetBrains Mono','Noto Sans Lao',monospace">
          <div style="background:#161B22;border:1px solid #30363D;border-radius:10px;padding:10px 16px"><div style="font-size:12px;color:#79C0FF">lessons</div><div style="font-size:22px;font-weight:700;color:#E3B341">4<span style="font-size:13px;color:#8B949E;font-weight:400"> / 18</span></div></div>
          <div style="background:#161B22;border:1px solid #30363D;border-radius:10px;padding:10px 16px"><div style="font-size:12px;color:#79C0FF">avgScore</div><div style="font-size:22px;font-weight:700;color:#E3B341">90<span style="font-size:13px;color:#8B949E;font-weight:400">%</span></div></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:13px;color:#8B949E">// settings</div>
        <a href="DesktopSettings.dc.html" style="display:flex;align-items:center;background:#161B22;border:1px solid #30363D;border-radius:10px;min-height:56px;box-sizing:border-box;padding:0 18px;font-size:16px"><span style="flex-grow:1">ພາສາ</span><span style="font-size:14px;color:#8B949E">ລາວ ›</span></a>
        <div style="display:flex;align-items:center;background:#161B22;border:1px solid #30363D;border-radius:10px;min-height:56px;box-sizing:border-box;padding:0 10px 0 18px;font-size:16px"><span style="flex-grow:1">ໂໝດສີ <span style="font-size:14px;color:#8B949E">· ມືດ</span></span>
          <a href="LightDesktopProfile.dc.html" aria-label="ສະຫຼັບເປັນໂໝດສະຫວ່າງ" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="position:relative;display:block;width:52px;height:30px;border-radius:15px;background:#21262D;border:1px solid #30363D;box-sizing:border-box"><span style="position:absolute;top:2px;left:2px;background:#E6EDF3;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span></a></div>
        <a href="DesktopSettings.dc.html" style="display:flex;align-items:center;background:#161B22;border:1px solid #30363D;border-radius:10px;min-height:56px;box-sizing:border-box;padding:0 18px;font-size:16px"><span style="flex-grow:1">ປ່ຽນລະຫັດຜ່ານ</span><span style="font-size:14px;color:#8B949E">›</span></a>
      </div>

      <button onClick="{{ open }}" style="align-self:flex-start;height:48px;box-sizing:border-box;padding:0 28px;border-radius:8px;border:1.5px solid #FF7B72;background:transparent;color:#FF7B72;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:15px;font-weight:700;cursor:pointer">$ logout</button>
    </div>
  </div>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(1,4,9,.75);display:flex;align-items:center;justify-content:center;padding:24px">
      <div role="dialog" aria-label="ຢືນຢັນການອອກຈາກລະບົບ" style="width:100%;max-width:420px;box-sizing:border-box;background:#161B22;border:1px solid #30363D;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px">
        <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:13px;color:#8B949E">// confirm</div>
        <div style="font-size:21px;font-weight:700">ອອກຈາກລະບົບບໍ?</div>
        <div style="font-size:15px;line-height:1.7;color:#8B949E">ຄະແນນທີ່ບັນທຶກແລ້ວຈະບໍ່ຫາຍ ເຂົ້າສູ່ລະບົບໃໝ່ໄດ້ທຸກເວລາ</div>
        <div style="display:flex;gap:12px;margin-top:6px">
          <button onClick="{{ close }}" style="flex:1;height:48px;box-sizing:border-box;border-radius:8px;border:1.5px solid #30363D;background:transparent;color:#E6EDF3;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;font-weight:700;cursor:pointer">cancel</button>
          <a href="DesktopAuth.dc.html" style="flex:1;height:48px;border-radius:8px;background:#FF7B72;color:#0D1117;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">$ logout</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  state = { confirm: false };
  renderVals() {
    return {
      confirm: this.state.confirm,
      open: () => this.setState({ confirm: true }),
      close: () => this.setState({ confirm: false })
    };
  }
}
</script>
</body>
</html>
