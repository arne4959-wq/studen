<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>ເບິ່ງເຉລີຍ ຈໍຄອມ</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none;color:inherit} button{font-family:inherit}</style>
</helmet>
<div style="min-height:880px;box-sizing:border-box;background:#0D1117;font-family:'Noto Sans Lao',system-ui,sans-serif;color:#E6EDF3;display:flex;flex-wrap:wrap;align-items:stretch">

  <div style="flex:1 1 240px;max-width:260px;min-width:200px;background:#161B22;border-right:1px solid #30363D;padding:20px 12px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;font-family:'JetBrains Mono','Noto Sans Lao',monospace">
    <div style="font-size:16px;font-weight:700;padding:0 8px"><span style="color:#3FB950">~/</span>ຮຽນງ່າຍ<span style="color:#3FB950">_</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;font-size:14px">
      <div style="font-size:11px;color:#8B949E;padding:0 8px 4px;letter-spacing:.08em">EXPLORER</div>
      <a href="DesktopHome.dc.html" style="min-height:44px;box-sizing:border-box;border-radius:6px;background:#0F2A1A;color:#3FB950;font-weight:700;display:flex;align-items:center;padding:0 10px">&gt; subjects/</a>
      <a href="DesktopDash.dc.html" style="min-height:44px;box-sizing:border-box;border-radius:6px;color:#8B949E;display:flex;align-items:center;padding:0 10px">stats/</a><a href="DesktopProfile.dc.html" style="min-height:44px;box-sizing:border-box;border-radius:6px;color:#8B949E;display:flex;align-items:center;padding:0 10px">profile/</a>
    </div>
  </div>

  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <div style="height:44px;background:#161B22;border-bottom:1px solid #30363D;display:flex;align-items:flex-end;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:13px">
      <div style="height:44px;display:flex;align-items:center;padding:0 20px;background:#0D1117;border-top:2px solid #3FB950;border-right:1px solid #30363D">answers.diff</div>
    <span style="flex-grow:1"></span><div style="align-self:center;padding-right:16px"><a href="LightDesktopReview.dc.html" aria-label="ສະຫຼັບເປັນໂໝດສະຫວ່າງ" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="position:relative;display:block;width:52px;height:30px;border-radius:15px;background:#21262D;border:1px solid #30363D;box-sizing:border-box"><span style="position:absolute;top:2px;left:2px;background:#E6EDF3;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span></a></div></div>

    <div style="box-sizing:border-box;padding:32px 48px;display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
        <h1 style="margin:0;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:28px;font-weight:700"><span style="color:#3FB950">$</span> git diff answers</h1>
        <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px"><span style="color:#3FB950;font-weight:700">4 passed</span>, <span style="color:#FF7B72;font-weight:700">1 failed</span></div>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;max-width:1000px">
        <div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <sc-if value="{{r.passIdle}}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ r.pick }}" aria-pressed="false" style="width:100%;display:flex;align-items:center;gap:10px;background:#161B22;border:1px solid #30363D;border-radius:8px;min-height:52px;box-sizing:border-box;padding:0 14px;font-family:inherit;font-size:14px;color:#E6EDF3;text-align:left;cursor:pointer"><span style="background:#3FB950;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">PASS</span><span style="flex-grow:1">{{r.title}}</span></button>
            </sc-if>
            <sc-if value="{{r.passSel}}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ r.pick }}" aria-pressed="true" style="width:100%;display:flex;align-items:center;gap:10px;background:#0F2A1A;border:2px solid #3FB950;border-radius:8px;min-height:52px;box-sizing:border-box;padding:0 14px;font-family:inherit;font-size:14px;color:#E6EDF3;font-weight:700;text-align:left;cursor:pointer"><span style="background:#3FB950;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">PASS</span><span style="flex-grow:1">{{r.title}}</span></button>
            </sc-if>
            <sc-if value="{{r.failIdle}}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ r.pick }}" aria-pressed="false" style="width:100%;display:flex;align-items:center;gap:10px;background:#2D1417;border:1px solid #FF7B72;border-radius:8px;min-height:52px;box-sizing:border-box;padding:0 14px;font-family:inherit;font-size:14px;color:#E6EDF3;text-align:left;cursor:pointer"><span style="background:#FF7B72;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">FAIL</span><span style="flex-grow:1">{{r.title}}</span></button>
            </sc-if>
            <sc-if value="{{r.failSel}}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ r.pick }}" aria-pressed="true" style="width:100%;display:flex;align-items:center;gap:10px;background:#2D1417;border:2px solid #FF7B72;border-radius:8px;min-height:52px;box-sizing:border-box;padding:0 14px;font-family:inherit;font-size:14px;color:#E6EDF3;font-weight:700;text-align:left;cursor:pointer"><span style="background:#FF7B72;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">FAIL</span><span style="flex-grow:1">{{r.title}}</span></button>
            </sc-if>
          </sc-for>
        </div>

        <div style="flex:1.6 1 380px;min-width:0;background:#161B22;border:1px solid #30363D;border-radius:10px;overflow:hidden;font-family:'JetBrains Mono','Noto Sans Lao',monospace">
          <div style="padding:10px 16px;border-bottom:1px solid #30363D;font-size:12px;color:#8B949E">{{file}}</div>
          <div style="padding:18px 20px;display:flex;flex-direction:column;gap:16px">
            <div style="font-size:18px;line-height:1.6"><span style="color:#D2A8FF">const</span> q = <span style="color:#3FB950">"{{cur.q}}"</span></div>
            <div style="border-radius:6px;overflow:hidden;font-size:15px;line-height:1.8">
              <sc-if value="{{curFail}}" hint-placeholder-val="{{ true }}">
                <div style="background:#2D1417;color:#FF7B72;padding:8px 14px"><b>-</b> {{cur.mine}} <span style="color:#8B949E">// ຄຳຕອບຂອງທ່ານ</span></div>
              </sc-if>
              <div style="background:#0F2A1A;color:#3FB950;padding:8px 14px"><b>+</b> {{cur.correct}} <span style="color:#8B949E">// ຄຳຕອບທີ່ຖືກ</span></div>
            </div>
            <div style="border-left:2px solid #79C0FF;padding:2px 0 2px 14px;font-family:'Noto Sans Lao',sans-serif;font-size:16px;line-height:1.8"><span style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;color:#79C0FF;font-size:13px">// ເຫດຜົນ</span><br>{{cur.reason}}</div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:12px;max-width:1000px">
        <a href="DesktopQuiz.dc.html" style="height:52px;padding:0 26px;border-radius:8px;background:#3FB950;color:#0D1117;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:15px;font-weight:700;display:flex;align-items:center">$ retry quiz</a>
        <a href="DesktopHome.dc.html" style="height:52px;box-sizing:border-box;padding:0 24px;border-radius:8px;border:1.5px solid #3FB950;color:#3FB950;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;font-weight:700;display:flex;align-items:center">cd ../subjects</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  state = { sel: 1 };
  renderVals() {
    const D = [
      { ok: true, q: 'Yesterday I ___ to school.', mine: 'walked', correct: 'walked', reason: 'Yesterday ບອກເວລາໃນອະດີດ ກິລິຍາປົກກະຕິ walk + ed = walked' },
      { ok: false, q: "What is the past tense of 'go'?", mine: 'gone', correct: 'went', reason: 'go ເປັນກິລິຍາບໍ່ປົກກະຕິ ຮູບອະດີດແມ່ນ went ສ່ວນ gone ແມ່ນ past participle' },
      { ok: true, q: 'She ___ breakfast at 7 yesterday.', mine: 'ate', correct: 'ate', reason: 'eat ເປັນກິລິຍາບໍ່ປົກກະຕິ ຮູບອະດີດແມ່ນ ate' },
      { ok: true, q: 'They ___ football last night.', mine: 'played', correct: 'played', reason: 'play + ed = played' },
      { ok: true, q: 'I ___ a bird this morning.', mine: 'saw', correct: 'saw', reason: 'see ເປັນກິລິຍາບໍ່ປົກກະຕິ ຮູບອະດີດແມ່ນ saw' }
    ];
    const s = this.state.sel;
    return {
      rows: D.map((d, k) => ({
        title: 'ຂໍ້ ' + (k + 1) + ' · ' + (d.ok ? d.correct : 'ເລືອກ ' + d.mine),
        passIdle: d.ok && s !== k,
        passSel: d.ok && s === k,
        failIdle: !d.ok && s !== k,
        failSel: !d.ok && s === k,
        pick: () => this.setState({ sel: k })
      })),
      cur: D[s],
      curFail: !D[s].ok,
      file: 'question_0' + (s + 1) + '.js'
    };
  }
}
</script>
</body>
</html>
