<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>ເບິ່ງເຉລີຍ</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none;color:inherit} button{font-family:inherit}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0D1117;font-family:'Noto Sans Lao',system-ui,sans-serif;color:#E6EDF3;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:52px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #30363D;background:#161B22">
    <a href="Score.dc.html" aria-label="ກັບຄືນ" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E6EDF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;color:#79C0FF">answers.diff</div>
  <span style="flex-grow:1"></span><a href="LightReview.dc.html" aria-label="ສະຫຼັບເປັນໂໝດສະຫວ່າງ" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="position:relative;display:block;width:52px;height:30px;border-radius:15px;background:#21262D;border:1px solid #30363D;box-sizing:border-box"><span style="position:absolute;top:2px;left:2px;background:#E6EDF3;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span></a></div>

  <div style="flex-grow:1;min-height:0;overflow-y:auto;padding:18px 20px 12px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;color:#8B949E">$ git diff answers</div>
      <div style="display:flex;gap:6px;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:12px">
        <sc-if value="{{isAll}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ showAll }}" aria-pressed="true" style="min-height:44px;padding:0 12px;border-radius:6px;background:#0F2A1A;border:1px solid #3FB950;color:#3FB950;font-weight:700;font-size:12px;cursor:pointer">ທັງໝົດ 5</button>
          <button onClick="{{ showFail }}" aria-pressed="false" style="min-height:44px;padding:0 12px;border-radius:6px;background:transparent;border:1px solid #30363D;color:#8B949E;font-size:12px;cursor:pointer">ຜິດ 1</button>
        </sc-if>
        <sc-if value="{{isFail}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ showAll }}" aria-pressed="false" style="min-height:44px;padding:0 12px;border-radius:6px;background:transparent;border:1px solid #30363D;color:#8B949E;font-size:12px;cursor:pointer">ທັງໝົດ 5</button>
          <button onClick="{{ showFail }}" aria-pressed="true" style="min-height:44px;padding:0 12px;border-radius:6px;background:#2D1417;border:1px solid #FF7B72;color:#FF7B72;font-weight:700;font-size:12px;cursor:pointer">ຜິດ 1</button>
        </sc-if>
      </div>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <sc-if value="{{r.show}}" hint-placeholder-val="{{ true }}">
        <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace">
          <sc-if value="{{r.closedPass}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ r.toggle }}" aria-expanded="false" style="width:100%;display:flex;align-items:center;gap:10px;background:#161B22;border:1px solid #30363D;border-radius:8px;min-height:48px;box-sizing:border-box;padding:0 12px;font-family:inherit;font-size:13px;color:#E6EDF3;text-align:left;cursor:pointer"><span style="background:#3FB950;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">PASS</span><span style="flex-grow:1">{{r.title}}</span><span style="color:#8B949E">⌄</span></button>
          </sc-if>
          <sc-if value="{{r.closedFail}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ r.toggle }}" aria-expanded="false" style="width:100%;display:flex;align-items:center;gap:10px;background:#2D1417;border:1px solid #FF7B72;border-radius:8px;min-height:48px;box-sizing:border-box;padding:0 12px;font-family:inherit;font-size:13px;color:#E6EDF3;text-align:left;cursor:pointer"><span style="background:#FF7B72;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">FAIL</span><span style="flex-grow:1">{{r.title}}</span><span style="color:#8B949E">⌄</span></button>
          </sc-if>
          <sc-if value="{{r.openPass}}" hint-placeholder-val="{{ false }}">
            <div style="background:#161B22;border:1px solid #3FB950;border-radius:8px;overflow:hidden">
              <button onClick="{{ r.toggle }}" aria-expanded="true" style="width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid #30363D;min-height:48px;box-sizing:border-box;padding:0 12px;font-family:inherit;font-size:13px;color:#E6EDF3;text-align:left;cursor:pointer"><span style="background:#3FB950;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">PASS</span><span style="flex-grow:1">{{r.title}}</span><span style="color:#8B949E">⌃</span></button>
              <div style="padding:12px;display:flex;flex-direction:column;gap:10px">
                <div style="font-size:14px;line-height:1.6">{{r.q}}</div>
                <div style="background:#0F2A1A;color:#3FB950;padding:6px 10px;border-radius:6px;font-size:13px;line-height:1.7"><b>+</b> {{r.correct}} <span style="color:#8B949E">// ຄຳຕອບຂອງທ່ານ</span></div>
                <div style="border-left:2px solid #79C0FF;padding:2px 0 2px 10px;font-family:'Noto Sans Lao',sans-serif;font-size:14px;line-height:1.7"><span style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;color:#79C0FF">// ເຫດຜົນ</span><br>{{r.reason}}</div>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{r.openFail}}" hint-placeholder-val="{{ false }}">
            <div style="background:#161B22;border:1px solid #FF7B72;border-radius:8px;overflow:hidden">
              <button onClick="{{ r.toggle }}" aria-expanded="true" style="width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid #30363D;min-height:48px;box-sizing:border-box;padding:0 12px;font-family:inherit;font-size:13px;color:#E6EDF3;text-align:left;cursor:pointer"><span style="background:#FF7B72;color:#0D1117;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">FAIL</span><span style="flex-grow:1">{{r.title}}</span><span style="color:#8B949E">⌃</span></button>
              <div style="padding:12px;display:flex;flex-direction:column;gap:10px">
                <div style="font-size:14px;line-height:1.6">{{r.q}}</div>
                <div style="border-radius:6px;overflow:hidden;font-size:13px;line-height:1.7">
                  <div style="background:#2D1417;color:#FF7B72;padding:6px 10px"><b>-</b> {{r.mine}} <span style="color:#8B949E">// ຄຳຕອບຂອງທ່ານ</span></div>
                  <div style="background:#0F2A1A;color:#3FB950;padding:6px 10px"><b>+</b> {{r.correct}} <span style="color:#8B949E">// ຄຳຕອບທີ່ຖືກ</span></div>
                </div>
                <div style="border-left:2px solid #79C0FF;padding:2px 0 2px 10px;font-family:'Noto Sans Lao',sans-serif;font-size:14px;line-height:1.7"><span style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;color:#79C0FF">// ເຫດຜົນ</span><br>{{r.reason}}</div>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex-shrink:0;padding:12px 20px 22px;display:flex;flex-direction:column;gap:10px;background:#161B22;border-top:1px solid #30363D">
    <a href="Quiz.dc.html" style="height:52px;border-radius:8px;background:#3FB950;color:#0D1117;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center">$ retry quiz</a>
    <a href="Subjects.dc.html" style="height:48px;box-sizing:border-box;border-radius:8px;border:1.5px solid #3FB950;color:#3FB950;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">cd ../subjects</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { open: 1, filter: 'all' };
  renderVals() {
    const D = [
      { ok: true, q: 'Yesterday I ___ to school.', mine: 'walked', correct: 'walked', reason: 'Yesterday ບອກເວລາໃນອະດີດ ກິລິຍາປົກກະຕິ walk + ed = walked' },
      { ok: false, q: "What is the past tense of 'go'?", mine: 'gone', correct: 'went', reason: 'go ເປັນກິລິຍາບໍ່ປົກກະຕິ ຮູບອະດີດແມ່ນ went ສ່ວນ gone ແມ່ນ past participle' },
      { ok: true, q: 'She ___ breakfast at 7 yesterday.', mine: 'ate', correct: 'ate', reason: 'eat ເປັນກິລິຍາບໍ່ປົກກະຕິ ຮູບອະດີດແມ່ນ ate' },
      { ok: true, q: 'They ___ football last night.', mine: 'played', correct: 'played', reason: 'play + ed = played' },
      { ok: true, q: 'I ___ a bird this morning.', mine: 'saw', correct: 'saw', reason: 'see ເປັນກິລິຍາບໍ່ປົກກະຕິ ຮູບອະດີດແມ່ນ saw' }
    ];
    const f = this.state.filter, o = this.state.open;
    return {
      isAll: f === 'all',
      isFail: f === 'fail',
      showAll: () => this.setState({ filter: 'all' }),
      showFail: () => this.setState({ filter: 'fail' }),
      rows: D.map((d, k) => {
        const isOpen = o === k;
        return {
          ...d,
          title: 'ຂໍ້ ' + (k + 1) + ' · ' + (d.ok ? d.correct : 'ເລືອກ ' + d.mine),
          show: f === 'all' || !d.ok,
          closedPass: !isOpen && d.ok,
          closedFail: !isOpen && !d.ok,
          openPass: isOpen && d.ok,
          openFail: isOpen && !d.ok,
          toggle: () => this.setState({ open: isOpen ? -1 : k })
        };
      })
    };
  }
}
</script>
</body>
</html>
