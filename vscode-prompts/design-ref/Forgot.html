<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>ລືມລະຫັດຜ່ານ</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none;color:inherit} button{font-family:inherit} input::placeholder{color:#8B949E} input:focus{outline:2px solid #3FB950;outline-offset:1px}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0D1117;font-family:'Noto Sans Lao',system-ui,sans-serif;color:#E6EDF3;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:52px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #30363D;background:#161B22">
    <a href="Login.dc.html" aria-label="ກັບຄືນ" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E6EDF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;color:#79C0FF">../login</div>
  <span style="flex-grow:1"></span><a href="LightForgot.dc.html" aria-label="ສະຫຼັບເປັນໂໝດສະຫວ່າງ" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="position:relative;display:block;width:52px;height:30px;border-radius:15px;background:#21262D;border:1px solid #30363D;box-sizing:border-box"><span style="position:absolute;top:2px;left:2px;background:#E6EDF3;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span></a></div>

  <div style="flex-grow:1;overflow:hidden;padding:28px 20px 0;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:13px;color:#8B949E">// ເຮົາຈະສົ່ງລິ້ງຕັ້ງລະຫັດຜ່ານໃໝ່ໃຫ້ທາງອີເມວ</div>
      <h1 style="margin:0;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:28px;font-weight:700"><span style="color:#3FB950">$</span> reset-password</h1>
    </div>

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <label style="display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:13px;color:#8B949E">
        <span><span style="color:#D2A8FF">const</span> ອີເມວ</span>
        <input type="email" placeholder="user@example.com" style="height:48px;box-sizing:border-box;border-radius:8px;border:1px solid #30363D;background:#161B22;color:#E6EDF3;padding:0 14px;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:15px">
      </label>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="background:#0F2A1A;border:1px solid #3FB950;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px">
        <div style="font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:15px;font-weight:700;color:#3FB950">✓ ສົ່ງລິ້ງແລ້ວ</div>
        <div style="font-size:15px;line-height:1.7">ກວດອີເມວຂອງທ່ານ ແລ້ວກົດລິ້ງເພື່ອຕັ້ງລະຫັດຜ່ານໃໝ່ ຖ້າບໍ່ເຫັນ ໃຫ້ລອງຫາໃນກ່ອງສະແປມ</div>
      </div>
    </sc-if>
  </div>

  <div style="flex-shrink:0;padding:12px 20px 22px;display:flex;flex-direction:column;gap:10px;background:#161B22;border-top:1px solid #30363D">
    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ send }}" style="height:52px;border:0;border-radius:8px;background:#3FB950;color:#0D1117;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:15px;font-weight:700;cursor:pointer">$ send-link</button>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ again }}" style="height:48px;box-sizing:border-box;border-radius:8px;border:1.5px solid #30363D;background:transparent;color:#E6EDF3;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;font-weight:700;cursor:pointer">resend()</button>
    </sc-if>
    <a href="Login.dc.html" style="height:48px;box-sizing:border-box;border-radius:8px;border:1.5px solid #3FB950;color:#3FB950;font-family:'JetBrains Mono','Noto Sans Lao',monospace;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">cd ../login</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { sent: false };
  renderVals() {
    return {
      sent: this.state.sent,
      notSent: !this.state.sent,
      send: () => this.setState({ sent: true }),
      again: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
